<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACC · Agent Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DevTheme: Chakra Petch + IBM Plex Mono. Blackwire: Rajdhani + JetBrains Mono. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the deck never flashes the wrong theme.
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var t = q === 'cyber' || q === 'dev' ? q : localStorage.getItem('acc-theme')
        document.documentElement.setAttribute('data-theme', t === 'cyber' ? 'cyber' : 'dev')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dev')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
